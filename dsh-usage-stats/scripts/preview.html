<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH 使用统计 · 本地预览</title>
<style>:root{color-scheme:dark;--dsw-alias-bg-layer-2:#161616;--dsw-alias-bg-layer-1:#232323;--dsw-alias-label-primary:#ccc;--dsw-alias-label-secondary:#8d8d8d;--dsw-alias-border-l2:#373737;--dsw-alias-bg-layer-3:#161616;background:#161616;color:#ccc;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}.light{color-scheme:light;--dsw-alias-bg-layer-2:#fff;--dsw-alias-bg-layer-1:#f4f4f4;--dsw-alias-label-primary:#262626;--dsw-alias-label-secondary:#777;--dsw-alias-border-l2:#e4e4e4;--dsw-alias-bg-layer-3:#fff;background:#fff;color:#262626}body{margin:0}.toolbar{padding:10px 24px;display:flex;gap:12px;align-items:center;font-size:12px;color:#888;border-bottom:1px solid var(--dsw-alias-border-l2)}.toolbar button{border:1px solid var(--dsw-alias-border-l2);background:transparent;color:inherit;padding:5px 10px;border-radius:6px;cursor:pointer}.toolbar span{margin-right:auto}#panel{max-width:1248px;margin:32px auto;padding:0 28px}#panel.narrow{max-width:560px}#panel:not(.narrow) .dus-root{gap:28px}#panel:not(.narrow) .dus-header h2{font-size:36px}#panel:not(.narrow) .dus-card{padding:22px}#panel:not(.narrow) .dus-metric strong{font-size:23px}#panel:not(.narrow) .dus-metric span{font-size:16px}#panel:not(.narrow) .dus-summary{padding:22px 0}#panel:not(.narrow) .dus-line{height:350px}#panel:not(.narrow) .dus-root h3{font-size:18px}#panel:not(.narrow) .dus-models{grid-template-columns:45% 1fr}#panel:not(.narrow) .dus-donut{height:280px}@media(max-width:600px){#panel{padding:0 16px;margin:24px auto}.toolbar{padding:8px 12px;flex-wrap:wrap}.toolbar span{width:100%}}</style>
<div class="toolbar"><span id="notice"></span><button id="theme">切换深浅主题</button><button id="width">切换设置面板宽度</button></div><main id="panel"><div id="root"></div></main><script type="module" src="/app.js"></script></html>
